name: V2 reference audit

on:
  push:
    branches:
      - 'validation/v2.*'
  pull_request:
    branches:
      - 'release/v2.*'
  workflow_dispatch:

concurrency:
  group: v2-reference-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  reference-audit:
    name: Unified V2 validation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate V2
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make nodejs poppler-utils
            make reference-assets
            UFC_REQUIRE_REFERENCE_IMAGES=1 python3 tests/run.py --mode pr

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v2-validation-${{ github.run_id }}
          path: |
            artifacts/validation
            documento.pdf
            documento.loi
            documento.lot
            documento.loc
            documento.loa
            documento.toc
          if-no-files-found: warn
          retention-days: 30

      - name: Publish reference audit status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          state = 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure'
          payload = json.dumps({
              'state': state,
              'context': 'ufctex/reference-audit',
              'description': 'Unified repository and V2 validation',
              'target_url': os.environ['RUN_URL'],
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'ufctex-reference-audit',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f'commit status HTTP {response.status}')
          PY
